name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Verify SKILL.md and agent frontmatter
        run: node scripts/verify-skills.mjs
      - name: Verify Service Cloud scope (no out-of-scope content)
        run: node scripts/verify-scope.mjs
      - name: Hook tests (guard-deploy)
        run: node --test .claude/hooks/tests/*.test.mjs
      - name: Pre-finalization script smoke
        run: node .claude/skills/sf-build/scripts/pre-finalizacao-check.mjs || [ $? -eq 2 ]
      - name: List discoverable skills (telemetry)
        run: npx -y skills add . --list --json | head -c 4000; echo

  code-analyzer:
    if: hashFiles('sfdx-project.json') != '' || hashFiles('force-app/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Salesforce CLI + Code Analyzer
        run: |
          npm i -g @salesforce/cli
          sf plugins install code-analyzer@latest --json || true
          sf code-analyzer --help || true
      - name: Run Code Analyzer
        run: |
          sf code-analyzer run --workspace . --output-file sfca.json --view table || true
          echo "=== sfca.json (head) ==="; head -c 6000 sfca.json; echo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfca-report
          path: sfca.json

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — bloqueia flags que furam portão de evidência
        run: |
          echo "Checking for --ignore-errors / NoTestRun in skills..."
          ! grep -R "ignore-errors" .claude --include="*.md" 2>/dev/null || (echo "❌ --ignore-errors encontrado" && exit 1)
          # NoTestRun em docs só com --metadata (o hook nega --source-dir + NoTestRun)
          if grep -RnE --include="*.md" -e "--source-dir.*NoTestRun" .claude 2>/dev/null | grep -v "nunca\|never\|negado\|denied\|denies\|bloqueia" | grep -q .; then
            echo "❌ doc manda --source-dir com NoTestRun (o guard-deploy nega)"; exit 1
          fi
          echo "✓ guard OK"
